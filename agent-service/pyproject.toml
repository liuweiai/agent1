[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypilot-agent"
version = "0.1.0"
description = "MES production anomaly diagnosis and closed-loop action agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "mcp>=2.0,<3",
  "pymysql>=1.1,<2",
  "pymilvus>=2.6,<3",
  "langsmith>=0.4,<1",
  "redis>=5.2,<7",
  "celery>=5.5,<6",
  "neo4j>=5.28,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
llm = [
  "langchain-openai>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
factorypilot-mes-mcp = "factorypilot.mcp_servers.mes_server:main"
factorypilot-knowledge-mcp = "factorypilot.mcp_servers.knowledge_server:main"
factorypilot-action-mcp = "factorypilot.mcp_servers.action_server:main"
factorypilot-vendor-a2a = "factorypilot.a2a.vendor_server:main"
factorypilot-worker = "factorypilot.task_queue:worker_main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
